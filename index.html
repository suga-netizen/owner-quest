<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="冒険">
<meta name="theme-color" content="#090c20">
<link rel="apple-touch-icon" href="img/app-icon.png">
<link rel="icon" href="img/app-icon.png">
<title>オーナーへの冒険</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
[hidden]{display:none!important}
img{max-width:100%}
.btnlike{border:2px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--fg);font-family:var(--display)}
/* Layout: a JRPG command screen. Double-ruled message windows in one column, a five-command menu fixed to the bottom. Single dark look by choice. */
:root{
  --bg:#090c20;
  --win:#0f1540;
  --win-2:#18215c;
  --pit:#04061a;
  --line:#e8ebff;
  --fg:#f1f3ff;
  --mute:#a3abde;
  --gold:#ffd25e;
  --leaf:#6fe3a8;
  --sky:#82c4ff;
  --rose:#ff93a3;
  --amber:#ffb36b;
  --display:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);
  background-image:radial-gradient(1px 1px at 12% 18%,var(--mute) 50%,transparent 51%),radial-gradient(1px 1px at 78% 9%,var(--mute) 50%,transparent 51%),radial-gradient(1px 1px at 52% 31%,var(--line) 50%,transparent 51%),radial-gradient(1px 1px at 88% 47%,var(--mute) 50%,transparent 51%),radial-gradient(1px 1px at 27% 62%,var(--mute) 50%,transparent 51%);
  color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));
}
main{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.win{border:5px double var(--line);border-radius:10px;background:var(--win);padding:14px 16px;min-width:0}
.win.warn{border-color:var(--amber)}
.win.alarm{border-color:var(--rose)}
.win.calm{border-color:var(--leaf)}
.wt{font-family:var(--display);font-size:13px;letter-spacing:.12em;color:var(--mute);margin:0 0 8px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
.dot{font-family:var(--display)}
.mute{color:var(--mute)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums;font-family:var(--display)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.bar{position:relative;height:12px;border:2px solid var(--line);border-radius:3px;background:var(--pit);overflow:hidden;flex:1;min-width:80px}
.bar>i{display:block;height:100%;background:var(--gold);transition:width .4s}
.bar.leaf>i{background:var(--leaf)}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--line)}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:40px;font:inherit;font-family:var(--display);color:var(--fg);background:var(--win-2);border:2px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;line-height:1.3}
@media (hover:hover){button:hover{background:var(--line);color:var(--win)}button.gold:hover{background:var(--gold);color:var(--win)}.sk:hover,.esc:hover{background:var(--win-2)}}
button:active{transform:translateY(1px)}
.row>button{white-space:nowrap;flex:none}
button.link{all:unset;cursor:pointer;color:var(--gold);text-decoration:underline;font-size:12px;padding:0 2px}
.form3{display:grid;grid-template-columns:1fr 1fr 6.5em;gap:8px}
@media (max-width:420px){.form3{grid-template-columns:1fr 1fr}.form3>:last-child{grid-column:1/-1}}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.gold{border-color:var(--gold);color:var(--gold)}
button.ghost{background:transparent;border-color:var(--mute);color:var(--mute)}
button.big{font-size:20px;min-width:52px;padding:6px 12px}
button.on{background:var(--line);color:var(--win)}
input,textarea,select{font:inherit;font-size:16px;color:var(--fg);background:var(--pit);border:2px solid var(--mute);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.lv{font-family:var(--display);font-size:30px;color:var(--gold);line-height:1}
.badge{font-family:var(--display);font-size:13px;color:var(--sky)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{border:1px solid var(--win-2);border-radius:6px;padding:6px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:20px;color:var(--fg)}
.stat span{font-size:11px;color:var(--mute)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:10px 4px}
.seg button.e3.on{background:var(--leaf);border-color:var(--leaf);color:var(--win)}
.seg button.e2.on{background:var(--sky);border-color:var(--sky);color:var(--win)}
.seg button.e1.on{background:var(--rose);border-color:var(--rose);color:var(--win)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--body);font-size:13px;padding:6px 12px;min-height:36px;border-radius:999px;border:1px solid var(--mute);background:transparent;color:var(--mute)}
.chip.on{border-color:var(--amber);color:var(--win);background:var(--amber)}
.card{font-size:16px;line-height:1.7}
.card .src{font-family:var(--display);font-size:12px;color:var(--gold)}
.buff{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--win-2)}
.buff:first-of-type{border-top:0}
.buff .nm{min-width:0}
.buff .nm b{font-family:var(--display);font-weight:400}
.buff .nm small{display:block;color:var(--mute);font-size:12px}
.buff button{padding:6px 9px;font-size:13px}
.buff button.full.on{background:var(--gold);border-color:var(--gold);color:var(--win)}
.buff button.mini.on{background:var(--leaf);border-color:var(--leaf);color:var(--win)}
.week7{display:flex;gap:3px;margin-top:3px}
.week7 i{width:8px;height:8px;border-radius:2px;background:var(--pit);border:1px solid var(--win-2)}
.week7 i.f{background:var(--gold);border-color:var(--gold)}
.week7 i.m{background:var(--leaf);border-color:var(--leaf)}
.esc{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:4px;width:100%}
.esc:focus-visible{background:var(--win-2)}
.esc .box{font-family:var(--display);width:1.4em;flex:none}
.esc.on .box{color:var(--leaf)}
.esc.on .lbl{color:var(--mute);text-decoration:line-through}
.sk{all:unset;cursor:pointer;display:grid;grid-template-columns:2.6em 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-radius:4px;width:100%}
.sk:focus-visible{background:var(--win-2)}
.sk .id{font-family:var(--display);color:var(--mute)}
.sk .nm{min-width:0}
.sk.main{background:var(--win-2)}
.sk.main .id{color:var(--gold)}
.dom-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.dom-head h2{font-size:18px}
.pips{display:flex;gap:3px}
.pip{width:12px;height:12px;border:2px solid var(--mute);border-radius:2px}
.pip.on{background:var(--leaf);border-color:var(--leaf)}
.pip.goal{border-color:var(--gold)}
.pip.on.goal{background:var(--gold)}
.qm{font-family:var(--display);color:var(--rose);font-size:13px}
.tag{font-family:var(--display);font-size:12px;border:1px solid var(--gold);color:var(--gold);border-radius:3px;padding:0 5px;white-space:nowrap}
.tag.rose{border-color:var(--rose);color:var(--rose)}
.tag.leaf{border-color:var(--leaf);color:var(--leaf)}
.crit{width:100%;border-collapse:collapse;font-size:13.5px}
.crit th,.crit td{border-bottom:1px solid var(--win-2);padding:8px 6px;text-align:left;vertical-align:top}
.crit th{font-family:var(--display);font-weight:400;color:var(--mute);white-space:nowrap}
.crit tr.here td,.crit tr.here th{background:var(--win-2)}
.crit tr.here th{color:var(--gold)}
.scroll{overflow-x:auto}
.promise{border-top:1px dashed var(--mute);padding-top:10px}
.promise:first-child{border-top:0;padding-top:0}
.promise .ttl{font-weight:700}
.grid28{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid28 div{aspect-ratio:1;max-width:100%;border-radius:3px;background:var(--pit);border:1px solid var(--win-2);display:flex;align-items:flex-end;justify-content:center;font-family:var(--display);font-size:10px;color:var(--win)}
.grid28 .e3{background:var(--leaf);border-color:var(--leaf)}
.grid28 .e2{background:var(--sky);border-color:var(--sky)}
.grid28 .e1{background:var(--rose);border-color:var(--rose)}
.grid28 .t{outline:2px solid var(--gold);outline-offset:1px}
.entry{border-top:1px dashed var(--mute);padding-top:10px}
.entry:first-child{border-top:0;padding-top:0}
.stairs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:6px}
.stairs li{display:grid;grid-template-columns:2.4em 1fr;gap:8px;padding:8px;border-radius:6px;border:1px solid transparent}
.stairs li.now{border-color:var(--gold);background:var(--win-2)}
.stairs .no{font-family:var(--display);font-size:20px;color:var(--mute)}
.stairs li.now .no{color:var(--gold)}
.stairs li.done .no{color:var(--leaf)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.list li .k{font-family:var(--display);color:var(--gold);flex:none}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{padding:6px;border-bottom:1px solid var(--win-2);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{font-family:var(--display);font-weight:400;color:var(--mute)}
nav.menu{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
nav.menu .win{max-width:620px;margin:0 auto;padding:6px 6px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.menu button{all:unset;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:var(--display);font-size:14px;text-align:center;padding:12px 0;border-radius:4px;color:var(--mute);white-space:nowrap}
nav.menu button::before{content:"▶";color:var(--gold);visibility:hidden;font-size:10px;margin-right:1px}
nav.menu button.on{color:var(--fg)}
nav.menu button.on::before{visibility:visible}
nav.menu button:focus-visible{outline:2px solid var(--gold)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(4,6,26,.8);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet .win{width:100%;max-width:620px;max-height:100%;overflow-y:auto}
@media (min-width:700px){.sheet{align-items:center}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;width:min(92vw,460px);font-family:var(--display);font-size:16px}
.toast .win{box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast b{color:var(--gold);font-weight:400}
.banner{display:block;width:100%;max-width:100%;height:150px;object-fit:cover;border-radius:6px;margin-bottom:12px;background:var(--pit)}
.banner.tall{height:190px}
.hero-row{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;margin-top:10px}
.hero-row img{width:110px;height:auto;max-width:100%}
.buff{grid-template-columns:40px 1fr auto auto!important}
.buff .ic{width:40px;height:40px}
.buff .ic.off{opacity:.45;filter:grayscale(.6)}
.tcard{width:min(210px,100%);margin:0 auto;aspect-ratio:225/332;background:center/100% 100% no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:34px 26px;gap:8px}
.tcard.fact{aspect-ratio:226/353;padding-top:50px}
.tcard.rare{aspect-ratio:252/380;padding:44px 32px}
.tcard p{font-size:15px;line-height:1.7}
.toast img{width:72px;height:auto;float:left;margin-right:10px}
.stairs .th{width:56px;height:56px;object-fit:cover;border-radius:4px;grid-row:span 1}
.stairs li{grid-template-columns:2.4em 56px 1fr!important}
.note{font-size:12px;color:var(--mute);text-align:center}
.del-confirm{color:var(--rose)!important;border-color:var(--rose)!important}
@keyframes pop{0%{transform:translate(-50%,10px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}
.toast{animation:pop .25s ease-out}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.bar>i{transition:none}}
</style>
</head>
<body>

<main id="app" aria-live="polite"></main>
<nav class="menu" aria-label="メニュー"><div class="win">
  <button data-tab="today">きょう</button>
  <button data-tab="promise">やくそく</button>
  <button data-tab="skill">スキル</button>
  <button data-tab="log">きろく</button>
  <button data-tab="star">ほし</button>
</div></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

function merge(o) {

/* ---------- storage: Firebase (Google login + Firestore, one private doc per user) ---------- */
let ref = null, unsub = null, saving = false, again = false, timer = null, pendingLocal = false, syncText = "";
let authReady = false, currentUser = null, loginError = "", LOCAL = false;
function save() {
  try { if (currentUser) localStorage.setItem(KEY + ":" + currentUser.uid, JSON.stringify(S)); } catch (e) {}
  pendingLocal = true; clearTimeout(timer); timer = setTimeout(flush, 600);
}
async function flush() {
  if (!ref) { pendingLocal = false; return; }
  if (saving) { again = true; return; }
  saving = true;
  try { await ref.set(JSON.parse(JSON.stringify(S))); setSync("クラウドに保存しました（どの端末からでも続きができます）"); }
  catch (e) { setSync("クラウドに保存できませんでした（" + (e.code || "error") + "）。通信を確認してください"); }
  saving = false;
  if (again) { again = false; flush(); } else pendingLocal = false;
}
function setSync(t) { syncText = t; const el = document.getElementById("sync"); if (el) el.textContent = t; }
function initCloud() {
  if (!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey || !window.firebase) {
    LOCAL = true; authReady = true; currentUser = {uid: "local", email: ""};
    try { const c = localStorage.getItem(KEY + ":local"); if (c) S = merge(JSON.parse(c)); } catch (e) {}
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    setSync("このスマホの中に保存しています");
    render(); return;
  }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth = firebase.auth(), db = firebase.firestore();
  auth.getRedirectResult().catch(e => { loginError = e.message; render(); });
  auth.onAuthStateChanged(u => {
    authReady = true; currentUser = u;
    if (unsub) { unsub(); unsub = null; }
    ref = null; S = defaults();
    if (u) {
      try { const c = localStorage.getItem(KEY + ":" + u.uid); if (c) S = merge(JSON.parse(c)); } catch (e) {}
      ref = db.collection("users").doc(u.uid);
      setSync("クラウドに接続しています…");
      unsub = ref.onSnapshot({includeMetadataChanges: false}, snap => {
        setSync("クラウドに保存しています（どの端末からでも続きができます）");
        if (pendingLocal || saving || snap.metadata.hasPendingWrites) return;
        if (snap.exists) {
          S = merge(JSON.parse(JSON.stringify(snap.data())));
          try { localStorage.setItem(KEY + ":" + u.uid, JSON.stringify(S)); } catch (e) {}
        }
        render();
      }, err => setSync("同期できませんでした（" + err.code + "）"));
    }
    render();
  });
}
function login() {
  loginError = "";
  const p = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(p).catch(e => {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") firebase.auth().signInWithRedirect(p);
    else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") { loginError = e.message; render(); }
  });
}

/* ---------- xp ---------- */
const levelOf = xp => 1 + Math.floor(Math.sqrt(Math.max(0, xp) / 40));
const xpFor = lv => 40 * (lv - 1) * (lv - 1);
function gain(n, msg) {
  const before = levelOf(S.xp);
  S.xp = Math.max(0, S.xp + n);
  const after = levelOf(S.xp);
  if (after > before) toast('<img src="img/levelup.webp" alt="">レベルが あがった！<br><b>Lv ' + after + "</b> になった。");
  else if (n > 0) toast(esc(msg || "") + " <b>+" + n + " XP</b>");
}
const lose = n => { S.xp = Math.max(0, S.xp - n); };
let toastTimer = null;

  const el = document.getElementById("toast");

function trust() {
  const k = S.promises.filter(p => p.status === "kept").length, d = S.promises.filter(p => p.status === "dropped").length;

/* ---------- early warning ---------- */
function alarm() {
  const t = today(), reasons = [];
  const last3 = [0, 1, 2].map(i => day(addDays(t, -i)));
  if (last3.filter(r => r && r.e === 1).length >= 2) reasons.push("調子の低い日が続いている");
  const known = Object.keys(S.days).filter(d => d < t);
  if (known.length >= 2 && !buffN(day(addDays(t, -1))) && !buffN(day(addDays(t, -2))) && !buffN(day(t))) reasons.push("バフが2日以上ゼロ");
  const signs = last3.reduce((n, r) => n + (r && r.signs ? r.signs.length : 0), 0);
  if (signs >= 3) reasons.push("予兆が" + signs + "つ重なっている");
  const past = Object.keys(S.days).filter(d => d < t && S.days[d].e).sort();
  const lastD = past[past.length - 1];
  if (lastD && daysBetween(lastD, t) >= 3 && !(day(t) && day(t).e)) reasons.push(daysBetween(lastD, t) + "日ぶりのチェックイン");
  return reasons;
}

/* ---------- daily card (changes each day; "もう1枚" draws again) ---------- */
function cardPool() {
  const p = [];
  S.affirm.forEach(a => p.push({src: "アファメーション", t: a}));
  (S.facts || []).forEach(f => p.push({src: "事実", t: f}));
  if (S.north.being) p.push({src: "北極星・あり方", t: S.north.being});
  if (S.north.mission) p.push({src: "北極星・使命", t: S.north.mission});
  S.promises.filter(x => x.status === "kept").forEach(x => p.push({src: "果たした約束", t: x.title + "（" + md(x.doneAt) + "）"}));
  Object.keys(S.weeks).forEach(k => { const w = S.weeks[k]; if (w.q2) p.push({src: md(k) + "の週、エネルギーが上がったこと", t: w.q2}); });
  S.escapes.forEach(e => p.push({src: "抜け出した波", t: md(e.date) + "、悪い波から自分で抜け出した"}));
  return p;
}
function todayCard() {
  const p = cardPool(), t = today();
  let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  if (!p.length) return {src: "はじめに", t: "「ほし」でアファメーションや自分の事実を足すと、ここに日替わりで出てきます"};
  return p[(h + cardShift * 7) % p.length];
}

function compareCard() {
  const t = today();
  const win = (endOff) => {
    const ds = []; for (let i = 0; i < 28; i++) ds.push(addDays(t, -endOff - i));
    const rec = ds.map(day).filter(Boolean);
    const es = rec.filter(r => r.e).map(r => r.e);
    const kept = S.promises.filter(p => p.status === "kept" && p.doneAt && daysBetween(p.doneAt, t) >= endOff && daysBetween(p.doneAt, t) < endOff + 28).length;
    return {n: rec.length, buff: (rec.reduce((a, r) => a + buffN(r), 0) / 4).toFixed(1), e: es.length ? (es.reduce((a, b) => a + b, 0) / es.length).toFixed(1) : "−", kept};
  };
  const now = win(0), then = win(90);
  if (then.n < 5) return '<section class="win"><p class="wt">3か月前の じぶんと くらべる</p><p class="small mute">比べる相手は他人ではなく、3か月前の自分。記録が3か月たまると、ここに並びます。</p></section>';
  return '<section class="win"><p class="wt">3か月前の じぶんと くらべる</p><table class="cmp"><thead><tr><th></th><th>3か月前</th><th>いま</th></tr></thead><tbody><tr><td>週あたりのバフ</td><td class="num">' + then.buff + '</td><td class="num">' + now.buff + '</td></tr><tr><td>調子の平均（3が最高）</td><td class="num">' + then.e + '</td><td class="num">' + now.e + '</td></tr><tr><td>果たした約束（4週間）</td><td class="num">' + then.kept + '</td><td class="num">' + now.kept + "</td></tr></tbody></table></section>";
}

    '<div class="row" style="flex-wrap:nowrap"><label for="nBase" style="flex:1">ベースライン<input id="nBase" type="number" min="1" value="3"></label><label for="nStretch" style="flex:1">ストレッチ<input id="nStretch" type="number" min="1" value="5"></label></div>' +
    '<label for="nQuestion">追いかける問い<input id="nQuestion"></label>' +
    '<div class="row" style="flex-wrap:nowrap"><label for="nStart" style="flex:1">開始<input id="nStart" type="date" value="' + start + '"></label><label for="nEnd" style="flex:1">終了（6週間）<input id="nEnd" type="date" value="' + addDays(start, 41) + '"></label></div>' +
    '<button class="gold" data-act="nextSeason">次のシーズンへ（+100 XP）</button></div>');
}
function buffSheet() {
  openSheet('<div class="stack">' + head("バフを編集") + '<p class="small mute">やると調子が上がるものだけ。最小版は「調子が最悪の日でもできる大きさ」にする。</p>' +
    S.buffs.map((b, i) => '<div class="stack" style="gap:6px;border-top:1px solid var(--win-2);padding-top:8px"><div class="row" style="flex-wrap:nowrap"><input id="bn' + i + '" value="' + esc(b.name) + '" aria-label="名前"><button class="ghost" data-act="delBuff" data-i="' + i + '">消す</button></div><div class="row" style="flex-wrap:nowrap"><input id="bf' + i + '" value="' + esc(b.full) + '" aria-label="全部"><input id="bm' + i + '" value="' + esc(b.mini) + '" aria-label="最小版"></div></div>').join("") +
    '<p class="dot small mute" style="margin-top:8px">新しいバフ</p><div class="row form3"><input id="bnNew" placeholder="名前"><input id="bfNew" placeholder="全部"><input id="bmNew" placeholder="最小版"></div>' +
    '<button class="gold" data-act="saveBuffs">保存する</button></div>');
}
function renegSheet(id) {
  const p = S.promises.find(x => x.id === id);
  openSheet('<div class="stack">' + head("約束を仕切り直す") + '<p style="font-weight:700">' + esc(p.title) + '</p><p class="small mute">仕切り直しは1回まで。破るのではなく、自分と交渉し直す。</p>' +
    '<label for="rDue">新しい期限<input id="rDue" type="date" value="' + addDays(today(), 14) + '"></label>' +
    '<label for="rWhy">なぜずらすか（一言）<input id="rWhy" placeholder="例：家業の繁忙期と重なった"></label>' +
    '<button class="gold" data-act="saveReneg" data-id="' + id + '">この期限で約束し直す</button></div>');
}

/* ---------- actions ---------- */
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
const arm = b => { if (b.dataset.armed) return true; b.dataset.armed = "1"; b.textContent = "本当に？"; b.classList.add("del-confirm"); return false; };
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-tab],[data-act]");
  if (!b) { if (ev.target.id === "sheet") closeSheet(); return; }
  if (b.dataset.tab && !b.dataset.act) { tab = b.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const a = b.dataset.act, s = S.season, t = today();
  switch (a) {
    case "go": tab = b.dataset.tab; render(); window.scrollTo(0, 0); break;
    case "energy": {
      const r = ensureDay(t), first = !r.e; r.e = Number(b.dataset.v);
      if (first) gain(10, r.e === 1 ? "充電日として記録" : "チェックイン"); save(); render(); break;
    }
    case "sign": {
      const r = ensureDay(t), v = b.dataset.v;
      r.signs = r.signs.includes(v) ? r.signs.filter(x => x !== v) : r.signs.concat(v); save(); render(); break;
    }
    case "draw": cardShift++; render(); break;
    case "buff": {
      const r = ensureDay(t), id = b.dataset.id, k = b.dataset.k, cur = r.buffs[id], pts = {full: 15, mini: 8};
      if (cur) lose(pts[cur]);
      if (cur === k) delete r.buffs[id]; else { r.buffs[id] = k; gain(pts[k], (S.buffs.find(x => x.id === id) || {}).name + (k === "mini" ? "（最小版）" : "")); }
      save(); render(); break;
    }
    case "escape": {
      const r = ensureDay(t), id = b.dataset.id;
      if (id === "one" && !r.escape.includes("one")) r.one = val("oneThing");
      const before = r.escape.length;
      r.escape = r.escape.includes(id) ? r.escape.filter(x => x !== id) : r.escape.concat(id);
      if (before < 3 && r.escape.length >= 3 && !S.escapes.some(e => e.date === t)) { S.escapes.push({date: t, one: r.one || ""}); gain(50, "波から抜け出した"); }
      save(); render(); break;
    }
    case "setOne": { const v = val("oneInput"); if (!v) break; week(weekKey(t)).one = v; gain(10, "今週の一つだけを決めた"); save(); render(); break; }
    case "oneDone": { week(weekKey(t)).oneDone = true; gain(40, "今週の一つだけ、達成"); save(); render(); break; }
    case "qplus": { s.progress += 1; s.log = s.log || []; s.log.push({date: t, note: val("qnote")}); gain(50, "クエストを進めた"); save(); render(); break; }
    case "qminus": { if (s.progress <= 0) break; s.progress -= 1; (s.log || []).pop(); lose(50); save(); render(); break; }
    case "claimBase": { s.gotBase = true; gain(200, "ベースライン到達！"); save(); render(); break; }
    case "claimStretch": { s.gotStretch = true; gain(400, "ストレッチ到達！"); save(); render(); break; }
    case "editQuest": questSheet(); break;
    case "saveQuest": {
      s.main = val("qMain") || s.main; s.quest = val("qQuest") || s.quest;
      s.base = Math.max(1, parseInt(val("qBase"), 10) || s.base); s.stretch = Math.max(s.base, parseInt(val("qStretch"), 10) || s.stretch);
      s.start = val("qStart") || s.start; s.end = val("qEnd") || s.end;
      s.question = val("qQuestion"); s.tool = val("qTool"); s.rule = val("qRule");
      save(); closeSheet(); render(); toast("クエストを更新した。"); break;
    }
    case "endSeason": endSheet(); break;
    case "nextSeason": {
      const q = val("nQuest");
      if (!q) { const el = document.getElementById("nQuest"); el.focus(); el.placeholder = "次のクエストを1文で書いてください"; break; }
      const from = S.skills[s.main];
      if (draftLv !== from) { S.skills[s.main] = draftLv; S.slog.push({date: t, id: s.main, from, to: draftLv, note: val("eNote")}); }
      S.history.push({no: s.no, main: s.main, quest: s.quest, progress: s.progress, base: s.base, stretch: s.stretch, gotBase: s.gotBase, gotStretch: s.gotStretch, comment: val("eNote"), start: s.start, end: s.end});
      const nb = Math.max(1, parseInt(val("nBase"), 10) || 3);
      S.season = {no: s.no + 1, main: val("nMain"), quest: q, base: nb, stretch: Math.max(nb, parseInt(val("nStretch"), 10) || 5), progress: 0, start: val("nStart"), end: val("nEnd"), question: val("nQuestion"), tool: s.tool, rule: s.rule, gotBase: false, gotStretch: false, log: []};
      gain(100, "シーズン完了"); save(); closeSheet(); render(); break;
    }
    case "skill": skillSheet(b.dataset.id); break;
    case "lvUp": case "lvDown": {
      if (a === "lvUp") draftLv = draftLv == null ? 1 : Math.min(5, draftLv + 1);
      else draftLv = draftLv == null ? null : draftLv <= 1 ? null : draftLv - 1;
      document.getElementById("draftLv").textContent = draftLv == null ? "?" : draftLv;
      document.querySelectorAll(".crit tbody tr").forEach((tr, i) => tr.classList.toggle("here", draftLv === i + 2));
      break;
    }
    case "saveLv": {
      const id = b.dataset.id, from = S.skills[id];
      if (draftLv === from) { closeSheet(); break; }
      S.skills[id] = draftLv; S.slog.push({date: t, id, from, to: draftLv, note: val("lvNote")});
      if (draftLv != null && (from == null || draftLv > from)) gain(100, id + " を記録"); else toast(id + " のレベルを記録した。");
      save(); closeSheet(); render(); break;
    }
    case "addPromise": {
      const title = val("pTitle"), due = val("pDue");
      if (!title || !due) { document.getElementById(title ? "pDue" : "pTitle").focus(); break; }
      S.promises.push({id: uid(), title, kind: val("pKind") || "やりたい", due, pts: Math.max(10, parseInt(val("pPts"), 10) || 100), status: "open", reneg: 0, created: t});
      save(); render(); toast("自分と約束した。"); break;
    }
    case "keep": { const p = S.promises.find(x => x.id === b.dataset.id); p.status = "kept"; p.doneAt = t; gain(p.pts, "約束を果たした"); save(); render(); break; }
    case "reneg": renegSheet(b.dataset.id); break;
    case "saveReneg": { const p = S.promises.find(x => x.id === b.dataset.id); p.due = val("rDue") || p.due; p.reneg = 1; p.why = val("rWhy"); save(); closeSheet(); render(); toast("約束を仕切り直した。"); break; }
    case "dropP": { if (!arm(b)) break; const p = S.promises.find(x => x.id === b.dataset.id); p.status = "dropped"; p.doneAt = t; save(); render(); break; }
    case "saveWeek": {
      const w = week(weekKey(t)), first = !w.done;
      w.q1 = val("q1"); w.q2 = val("q2"); w.q3 = val("q3");
      if (!w.q1 && !w.q2 && !w.q3) { document.getElementById("q1").focus(); break; }
      w.done = true;
      if (w.q3) { const nx = week(addDays(weekKey(t), 7)); if (!nx.one) nx.one = w.q3; }
      if (first) gain(30, "今週を振り返った"); else toast("書き直した。");
      save(); render(); break;
    }
    case "addIdea": { const v = val("idea"); if (v) { S.ideas.push(v); save(); render(); } break; }
    case "delIdea": { if (!arm(b)) break; S.ideas.splice(Number(b.dataset.i), 1); save(); render(); break; }
    case "addAffirm": { const v = val("affirm"); if (v) { S.affirm.push(v); save(); render(); } break; }
    case "delAffirm": { if (!arm(b)) break; S.affirm.splice(Number(b.dataset.i), 1); save(); render(); break; }
    case "stage": { S.stage = Number(b.dataset.no); save(); render(); toast("現在地を 第" + S.stage + "段 にした。"); break; }
    case "editBuffs": buffSheet(); break;
    case "delBuff": { if (!arm(b)) break; S.buffs.splice(Number(b.dataset.i), 1); save(); buffSheet(); render(); break; }
    case "saveBuffs": {
      S.buffs.forEach((x, i) => { x.name = val("bn" + i) || x.name; x.full = val("bf" + i) || x.full; x.mini = val("bm" + i) || x.mini; });
      const n = val("bnNew"); if (n) S.buffs.push({id: "b" + uid(), name: n, full: val("bfNew") || n, mini: val("bmNew") || "少しだけやる"});
      save(); closeSheet(); render(); break;
    }
    case "close": closeSheet(); break;
    case "login": login(); break;
    case "logout": firebase.auth().signOut(); break;
    case "export": exportData(); render(); break;
    case "copyBackup": {
      const txt = JSON.stringify(S);
      const done = () => { markBackup(); render(); toast("バックアップをコピーした。メモアプリなどに貼って保存しよう。"); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => { const ta = document.getElementById("pasteData"); ta.value = txt; ta.select(); toast("文字を選択した。コピーして保存しよう。"); });
      else { const ta = document.getElementById("pasteData"); ta.value = txt; ta.select(); }
      break;
    }
    case "pasteImport": { const v = val("pasteData"); if (v) importText(v); break; }
    case "addFact": { const v = val("fact"); if (v) { S.facts = (S.facts || []).concat(v); save(); render(); } break; }
    case "delFact": { if (!arm(b)) break; S.facts.splice(Number(b.dataset.i), 1); save(); render(); break; }
  }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.id === "importFile" && el.files && el.files[0]) { importData(el.files[0]); el.value = ""; return; }
  if (el.dataset.field) { S[el.dataset.field] = el.value; save(); }
  if (el.dataset.north) { S.north[el.dataset.north] = el.value; save(); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !document.getElementById("sheet").hidden) closeSheet(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && document.getElementById("sheet").hidden && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") render(); });

render();
initCloud();
</script>
